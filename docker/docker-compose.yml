# NyumbaLink - PostgreSQL + Backend API
# Run: docker-compose -f docker/docker-compose.yml up -d
# Frontend: run separately with npm run dev (see README)

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nyumbalink-db
    environment:
      POSTGRES_USER: nyumbalink
      POSTGRES_PASSWORD: nyumbalink_secret
      POSTGRES_DB: nyumbalink
    ports:
      - "5432:5432"
    volumes:
      - nyumbalink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyumbalink -d nyumbalink"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: nyumbalink-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nyumbalink:nyumbalink_secret@postgres:5432/nyumbalink
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nyumbalink_pgdata:
